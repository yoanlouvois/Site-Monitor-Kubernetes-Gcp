apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: site-monitor
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: redis
      # PSS : pas de jeton pour l'API Kubernetes
      automountServiceAccountToken: false
      # PSS : utilisateur "redis" de l'image alpine (UID 999, groupe 1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          # PSS : aucun droit supplémentaire, système de fichiers en lecture seule
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Sauvegarde RDB : survit à un redémarrage du conteneur, pas à la suppression du pod
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: site-monitor
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379