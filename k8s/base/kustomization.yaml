# Base commune à tous les environnements.
# Ne s'applique pas directement : utiliser un overlay (k8s/overlays/local ou gcp).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: site-monitor

resources:
  - namespace.yaml
  # Configuration (secret.yaml n'est pas dans Git : le créer à partir de secret.example.yaml)
  - config/configmap.yaml
  - config/secret.yaml
  # Données
  - ../../db
  - data/redis.yaml
  - data/postgres.yaml
  # Applications
  - apps/api.yaml
  - apps/api-hpa.yaml
  - apps/alerter.yaml
  - apps/checker.yaml
  - apps/cleanup.yaml
  - apps/frontend.yaml
  # Entrée HTTP (Gateway API)
  - routing/frontend-route.yaml
    # Sécurité
  - security/networkpolicies.yaml
  - security/serviceaccounts.yaml
  - security/rbac-viewer.yaml