apiVersion: batch/v1
kind: CronJob
metadata:
  name: checker
  namespace: site-monitor
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app: checker
        spec:
          restartPolicy: Never
          serviceAccountName: checker
          # PSS : pas de jeton pour l'API Kubernetes
          automountServiceAccountToken: false
          # PSS : utilisateur "app" de l'image (UID 999)
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: checker
              image: site-monitor/checker:0.1.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: site-monitor-config
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: site-monitor-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              # PSS : aucun droit supplémentaire, système de fichiers en lecture seule
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}