# Tout le projet s'applique avec : kubectl apply -k k8s/
# Prérequis : les CRD de la Gateway API et Traefik (voir scripts/local-up.ps1)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: site-monitor

resources:
  - namespace.yaml
  - config/configmap.yaml
  - config/secret.yaml
  - ../db
  - data/redis.yaml
  - data/postgres.yaml
  # Applications
  - apps/api.yaml
  - apps/alerter.yaml
  - apps/checker.yaml
  - apps/cleanup.yaml
  - apps/frontend.yaml
  # Entrée HTTP (Gateway API)
  - routing/frontend-route.yaml

# images et versions.
images:
  - name: site-monitor/api
    newTag: "0.1.0"
  - name: site-monitor/checker
    newTag: "0.1.0"
  - name: site-monitor/alerter
    newTag: "0.1.0"
  - name: site-monitor/frontend
    newTag: "0.1.1"