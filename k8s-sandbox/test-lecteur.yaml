apiVersion: v1
kind: Pod
metadata:
  name: test-lecteur
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-2
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "cat /data/preuve.txt && sleep 3600"]
      volumeMounts:
        - name: disque
          mountPath: /data
  volumes:
    - name: disque
      persistentVolumeClaim:
        claimName: test-disque